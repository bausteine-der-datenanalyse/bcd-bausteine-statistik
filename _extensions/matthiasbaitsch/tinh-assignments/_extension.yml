title: tinh-assignments
author: Matthias Baitsch
version: 0.1.0
quarto-required: ">=1.8.0"
contributes:
  formats:
    html:
      lang: de
      css:
        - tinh-assignments.css
      default-image-extension: svg
    pdf:
      lang: de
      filters:
        - latex-environment.lua
      commands: [neuerbegriff, ja, nein]
      environments: [beispiel]
      include-in-header:
        - tinh-assignments.tex
      default-image-extension: pdf
