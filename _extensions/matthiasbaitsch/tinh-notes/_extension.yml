title: tinh-notes
author: Matthias Baitsch
version: 0.8.0
quarto-required: ">=1.8.0"
contributes:
  formats:
    common:
      # Makros aus tinh-macros (\SI, \R, ...), Bilder zentrieren aus tinh-common
      filters:
        - ../tinh-macros/macros.lua
        - path: ../tinh-common/center-images.lua
          at: pre-ast
      fig-align: center
      number-depth: 3
      # Chicago author-date auf Deutsch, auch für die Literaturseite eines Books (dort kommt lang nicht an)
      csl: chicago-author-date-de.csl
    html:
      lang: de
      toc: true
      toc-depth: 4
      css:
        - tinh-notes.css
      default-image-extension: svg
    pdf:
      lang: de
      # eingebettet mit quarto add quarto-ext/latex-environment --embed tinh-notes
      filters:
        - latex-environment
      commands: [neuerbegriff, eng, ja, nein]
      include-in-header:
        - tinh-notes.tex
      include-after-body:
        text: |
          \printindex
      default-image-extension: pdf
